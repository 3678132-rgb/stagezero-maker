<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="스테이지제로">
<meta name="theme-color" content="#1f3bb3">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}#sw-bar{position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#1f3bb3;color:#fff;border-radius:12px;padding:10px 14px;font:600 13px/1.4 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25)}</style>
</head><body><title>스테이지 제로 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* Layout: 프린세스 메이커식 3단 — 초상(좌) · 스테이터스(중) · 스케줄(우), 하단 대화창. 긁힌 유리가 브랜드 성장과 함께 투명해진다. */
:root{
  --paper:#E7ECEE; --paper-2:#D8DFE2; --glass:rgba(255,255,255,.7); --glass-solid:#F6F8F9; --line:rgba(21,25,28,.13);
  --ink:#14181B; --mute:#56636B; --serum:#2B44C0; --serum-soft:#DDE3FA; --skin:#EDCFB8; --glow:#B9875A;
  --good:#277452; --warn:#9E6410; --bad:#AE3437;
  --f-display:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --r:6px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--paper);
  background-image:radial-gradient(120% 80% at 15% 0%, #F7F9FA 0%, transparent 55%), radial-gradient(90% 70% at 100% 100%, #DCE2F5 0%, transparent 60%);
  color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.55; word-break:keep-all; overflow-wrap:anywhere;
  padding-inline:16px; padding-block:16px 24px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--serum);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- 타이틀 ---------- */
.title-screen{min-height:calc(100vh - 60px);display:grid;place-items:center;text-align:center}
.title-inner{display:grid;gap:22px;justify-items:center;max-width:620px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,9vw,88px);line-height:1;letter-spacing:-.01em;margin:0}
.wordmark .colon{color:var(--serum);display:inline-block;transform:translateY(-.04em)}
.wordmark small{display:block;font-size:.34em;letter-spacing:.42em;font-weight:700;margin-top:.5em;color:var(--mute)}
.title-copy{font-size:15px;color:var(--mute);max-width:44ch;text-wrap:balance;margin:0}
.glass-pane{position:relative;width:min(260px,70vw);aspect-ratio:3/4;padding:6px;background:var(--glass-solid)}
.glass-pane .in{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid var(--glow)}
.glass-pane img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.glass-pane svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:#F4F6F7;padding:11px 22px;border-radius:999px;font-weight:600;letter-spacing:.02em}
.btn:hover{background:var(--serum);border-color:var(--serum)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--glass-solid);color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed;background:var(--mute);border-color:var(--mute)}

/* ---------- 셋업 ---------- */
.setup{max-width:760px;margin:24px auto;display:grid;gap:22px}
.setup h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;text-wrap:balance}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.field input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--glass-solid);color:var(--ink)}
.field input:focus{outline:2px solid var(--serum);outline-offset:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.prof{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--glass)}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px}.pl{font-weight:700;font-size:13px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}.pchips button{min-width:44px;padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.pchips button[aria-pressed="true"]{background:var(--serum);color:#fff;border-color:var(--serum)}
.pchips .ax{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.pchips .ax button{border:0;border-radius:0;min-width:38px}
#pf-zodiac{padding:8px 10px;border-radius:10px;border:1px solid var(--line);font:inherit;background:#fff}
.pf-sum{font-size:12.5px;line-height:1.6;color:var(--ink)}.pf-sum b{color:var(--serum)}.pf-sum .tr{color:var(--mute)}
.origins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.origin{text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:var(--r);padding:14px;display:grid;gap:4px}
.origin b{font-size:15px}
.origin span{font-size:12.5px;color:var(--mute)}
.origin .mono{font-size:11px;color:var(--serum)}
.origin[aria-pressed="true"]{border-color:var(--serum);box-shadow:inset 0 0 0 1px var(--serum);background:#fff}

/* ---------- 게임 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.topbar .brandmark{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.01em}
.topbar .brandmark .colon{color:var(--serum)}
.topbar .date{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.date .big{font-family:var(--f-display);font-weight:800;font-size:20px}
.date .sub{font-size:12px;color:var(--mute)}
.top-actions{display:flex;gap:8px}
.mini{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:12px}
.mini:hover{border-color:var(--ink)}

.board{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
/* 무대: 장면 그림 위에 대화창이 겹친다 */
.stage{padding:0;overflow:hidden}
.stage-view{position:relative;width:min(460px, calc((100vh - 190px) * .75), 100%);aspect-ratio:3/4;margin:6px 6px 0}
.stage-view .frame{position:absolute!important;inset:0;margin:0!important;aspect-ratio:auto!important;border:1px solid var(--glow)}
.side{display:grid;gap:10px;align-content:start;max-height:calc(100vh - 110px);overflow:auto}
.side-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.side-tab{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.side-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--serum)}
.quick{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute)}
.quick b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.quick b.warn{color:var(--bad)}
.restore-inline{font-size:11px;color:var(--mute)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 10px;font-size:11px;font-family:var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500;display:flex;justify-content:space-between;gap:8px}

.portrait{padding:0;overflow:hidden}
.portrait .frame{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:var(--paper-2)}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;animation:fadein .5s ease both}
.scene-tag{position:absolute;left:10px;bottom:10px;background:rgba(20,24,27,.72);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.scr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
@keyframes fadein{from{opacity:.4}to{opacity:1}}
/* PM2풍 이중 액자: 잉크 외곽선 + 금박 안쪽선 */
.ornate{border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--glass-solid),inset 0 0 0 4px var(--glow)}
.ornate .frame{margin:6px 6px 0;border:1px solid var(--glow)}
.portrait .plate{padding:8px 14px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;border-top:1px solid var(--line);background:var(--glass-solid)}
.plate .who{font-family:var(--f-display);font-weight:800;font-size:18px}
.plate .what{font-size:12px;color:var(--mute)}
.plate .tier{font-size:11px;color:var(--serum);font-family:var(--f-mono);letter-spacing:.06em}
.restore{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}

.meter{display:grid;grid-template-columns:52px minmax(0,1fr) 34px;align-items:center;gap:8px;font-size:12.5px;padding-block:3px}
.meter .bar{height:7px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.meter .fill{height:100%;background:var(--ink);border-radius:999px;transition:width .5s ease}
.meter .v{text-align:right;font-family:var(--f-mono);font-size:12px}
.meter.hp .fill{background:var(--good)}
.meter.stress .fill{background:var(--warn)}
.meter.stress.hot .fill{background:var(--bad)}
.meter.aw .fill,.meter.fan .fill{background:var(--serum)}
.meter.prog .fill{background:linear-gradient(90deg,var(--glow),var(--serum))}
.group{display:grid;gap:2px;padding-block:8px;border-top:1px solid var(--line)}
.group:first-of-type{border-top:0;padding-top:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding-block:8px;border-top:1px solid var(--line)}
.kv div{display:grid;gap:0}
.kv small{font-size:11px;color:var(--mute)}
.kv b{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.kv b.neg{color:var(--bad)}
.chips-inline{display:flex;flex-wrap:wrap;gap:5px;padding-block:6px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mute);background:var(--glass-solid)}
.tag.on{border-color:var(--serum);color:var(--serum);background:var(--serum-soft)}
.prods{display:grid;gap:3px;font-size:12px;padding-top:6px;border-top:1px solid var(--line)}
.prods div{display:flex;justify-content:space-between;gap:8px}
.prods span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prods .q{font-family:var(--f-mono);color:var(--mute)}
.spark{width:100%;height:46px;display:block}

/* 스케줄 */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.slot{border:1px dashed var(--mute);border-radius:var(--r);padding:8px 10px;min-height:62px;text-align:left;background:transparent;display:grid;align-content:start;gap:2px}
.slot small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.slot b{font-size:13px;line-height:1.3}
.slot.filled{border-style:solid;border-color:var(--ink);background:#fff}
.slot.active{box-shadow:inset 0 0 0 1px var(--serum);border-color:var(--serum)}
.slot.running{border-color:var(--serum);background:var(--serum-soft)}
.tabs{display:flex;gap:4px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--glass-solid);border-radius:var(--r);padding:9px 10px;text-align:left;display:grid;gap:3px;min-width:0}
.act:hover:not(:disabled){border-color:var(--ink);background:#fff}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{font-size:13.5px}
.act .d{font-size:11.5px;color:var(--mute);line-height:1.4}
.act .meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.act .meta .c{color:var(--ink)}
.act .lock{font-size:11px;color:var(--bad)}
.plan-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.plan-foot .sum{font-size:12px;color:var(--mute)}

/* 대화창 */
.dialog{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;max-height:66%;overflow:auto;background:rgba(248,249,251,.94);backdrop-filter:blur(4px);border:1px solid var(--ink);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;box-shadow:0 6px 24px rgba(20,24,27,.25)}
.dialog .text{font-size:13.5px}
.dlg-close{position:absolute;top:4px;right:6px;border:0;background:transparent;font-size:18px;line-height:1;color:var(--mute);padding:4px 6px}
.stage-view .frame{cursor:pointer}
.dialog .face{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--glow);background-size:cover;background-position:center 18%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.dialog .face.ceo{background:var(--skin);color:var(--ink);font-size:15px}
.dialog .face.news{background:var(--serum);font-size:14px;font-family:var(--f-body)}
.dialog .speaker{font-size:11px;font-family:var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.dialog .head{font-family:var(--f-display);font-weight:800;font-size:16px;margin:2px 0 4px;text-wrap:balance}
.dialog .text{white-space:pre-line;max-width:72ch}
.dialog .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;animation:pop .35s ease both}
.chip.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.down{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
@keyframes pop{from{transform:translateY(4px);opacity:.2}to{transform:none;opacity:1}}
.dialog .choices{display:grid;gap:6px;margin-top:10px}
.choice{border:1px solid var(--ink);background:#fff;border-radius:var(--r);padding:8px 12px;text-align:left;font-weight:500}
.choice:hover:not(:disabled){background:var(--ink);color:#fff}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
.dialog .next{grid-column:1 / -1;display:flex;justify-content:flex-end;position:sticky;bottom:0}
.dialog .next-btn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 16px;font-size:12.5px;font-weight:600}
.dialog .next-btn:hover{background:var(--serum)}
.dialog.has-next{padding-bottom:10px}

/* 엔딩 */
.ending{max-width:880px;margin:20px auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.ending .card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--glass-solid)}
.ending .grade{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--serum)}
.ending h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,38px);margin:6px 0 10px;text-wrap:balance;line-height:1.2}
.ending p{max-width:60ch;color:var(--ink)}
.report{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin-block:18px;padding-block:14px;border-block:1px solid var(--line)}
.report small{display:block;font-size:11px;color:var(--mute)}
.report b{font-family:var(--f-mono);font-size:16px}
.album{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.album .tag{font-size:11.5px}

/* 저장·불러오기 창 */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(20,24,27,.45)}
.modal .box{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--glass-solid);padding:18px 18px 16px;display:grid;gap:12px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px}
.modal .hint{margin:0;font-size:12.5px;color:var(--mute)}
.saveslots{display:grid;gap:8px}
.ss{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 10px;text-align:left;width:100%}
.ss.pick:hover:not(:disabled){border-color:var(--ink)}
.ss:disabled{cursor:not-allowed;opacity:.55}
.ss .th{width:54px;aspect-ratio:3/4;border:1px solid var(--glow);background:var(--paper-2) center top/cover no-repeat;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.ss .no{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--mute)}
.ss b{display:block;font-size:14px}
.ss .meta2{font-size:12px;color:var(--mute)}
.ss .side{display:flex;gap:6px;align-items:center}
.ss-wrap{display:grid;gap:6px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;padding:2px 2px 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;animation:pop .3s ease both}
.end-art{position:relative;aspect-ratio:3/4;overflow:hidden;margin:6px 6px 0;border:1px solid var(--glow)}
.end-art img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;animation:fadein .8s ease both}

@media (max-width:820px){
  .board{grid-template-columns:minmax(0,1fr)}
  .stage-view{width:min(calc(100% - 12px), calc(44vh * .75));margin:6px auto 0;transition:width .3s ease}
  body.running .stage-view{width:min(calc(100% - 12px), calc(66vh * .75))}
  .topbar{gap:6px 10px;padding-bottom:8px;margin-bottom:8px}
  .topbar .brandmark{display:none}
  .date .big{font-size:17px}
  .mini{padding:4px 10px}
  .side{max-height:none;overflow:visible}
}
@media (max-width:640px){
  .board{grid-template-columns:minmax(0,1fr)}
  .fields,.origins{grid-template-columns:minmax(0,1fr)}
  .ending{grid-template-columns:minmax(0,1fr)}
  .report{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dialog{grid-template-columns:32px minmax(0,1fr);gap:8px;max-height:72%;left:6px;right:6px;bottom:6px}
  .dialog .face{width:32px;height:32px;font-size:16px}
  .acts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .act .d{display:none}
}

/* ===== 모바일 게임 홈 화면: 한 화면에 장면 + 떠 있는 버튼 ===== */
body.game-mode{padding:0;margin:0}
.phone{position:relative;max-width:460px;margin:0 auto;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px;overflow:hidden;background:#1b2140;--dlg-bottom:212px}
@media (min-width:600px){ .phone{margin-block:12px;border-radius:24px;height:min(calc(100dvh - 24px),940px);box-shadow:0 20px 50px rgba(20,24,27,.35)} }
.phone .scene{position:absolute;inset:0;overflow:hidden;background:#1b2140}
.phone .scene::before{content:'';position:absolute;inset:-30px;background:var(--scene-bg) center/cover no-repeat;filter:blur(18px) brightness(.75) saturate(1.1)}
.phone .scene .pimg{position:absolute;left:0;right:0;top:108px;bottom:0;width:100%;height:calc(100% - 108px);object-fit:cover;object-position:50% 0;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 28px);mask-image:linear-gradient(180deg,transparent 0,#000 28px)}
.phone .scene .scr{position:absolute;inset:0;width:100%;height:100%}
.phone .scene .scene-tag{top:122px;bottom:auto;left:50%;transform:translateX(-50%)}
.scene-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(15,20,45,.5) 0%,rgba(15,20,45,0) 16%,rgba(15,20,45,0) 66%,rgba(15,20,45,.45) 100%)}
.hud-top{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:4}
.avatar{width:58px;height:58px;flex:none;border-radius:16px;border:3px solid #E9C77A;background:#f3ead9 50% 9%/330% no-repeat;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.hud-center{flex:1;min-width:0;background:rgba(18,24,52,.62);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:6px 12px;backdrop-filter:blur(4px)}
.hud-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-line b{font-family:var(--f-display);font-size:16px;font-weight:800}
.hud-line span{font-size:12px;opacity:.9}
.hud-bar{height:9px;margin-top:4px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.hud-bar i{display:block;height:100%;background:linear-gradient(90deg,#E9C77A,#FFF1C2);border-radius:99px}
.hud-sub{font-size:10.5px;opacity:.85;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{width:52px;height:52px;flex:none;border-radius:50%;border:3px solid #E9C77A;background:radial-gradient(circle at 35% 30%,#fff,#dfe6fb);color:var(--serum);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.hud-res{position:absolute;top:82px;left:12px;right:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;z-index:4}
.res{display:flex;align-items:center;gap:6px;background:rgba(18,24,52,.62);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 10px 3px 4px;font-size:12px;backdrop-filter:blur(4px)}
.res i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;background:#E9C77A;color:#3d2a08}
.res b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.res b.warn{color:#ffb4b4}
.side-l,.side-r{position:absolute;top:128px;display:grid;gap:14px;z-index:4}
.side-l{left:8px}.side-r{right:8px}
.fab{position:relative;width:68px;border:0;background:none;padding:0;display:grid;justify-items:center;color:#fff;cursor:pointer}
.fab .ic{width:54px;height:54px;border-radius:18px;background:linear-gradient(180deg,#ffffff,#e4eaf9);border:3px solid #E9C77A;color:var(--serum);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.fab .lb{margin-top:-9px;position:relative;font-size:11px;font-weight:800;background:linear-gradient(180deg,#5a74e8,var(--serum));border:2px solid #fff;border-radius:99px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.fab:active .ic,.tb:active .ic,.cta:active{transform:translateY(2px)}
.badge{position:absolute;top:-6px;right:2px;width:22px;height:22px;border-radius:50%;background:#e23b3b;color:#fff;border:2px solid #fff;font-weight:900;font-size:13px;display:grid;place-items:center}
.gauge svg{width:46px;height:46px}
.bottom-area{position:absolute;left:0;right:0;bottom:84px;z-index:4;display:grid;justify-items:center;gap:8px;padding-inline:12px}
.slots3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.slot3{border:2px dashed rgba(255,255,255,.75);background:rgba(18,24,52,.5);color:#fff;border-radius:12px;padding:5px 8px;text-align:left;min-height:46px;display:grid;align-content:start;backdrop-filter:blur(3px)}
.slot3 small{font-size:10px;opacity:.8;letter-spacing:.1em}
.slot3 b{font-size:12px;line-height:1.25}
.slot3.filled{border-style:solid;border-color:#E9C77A;background:rgba(255,255,255,.92);color:var(--ink)}
.slot3.running{border-color:#fff;background:var(--serum);color:#fff}
.cta{width:min(80%,320px);padding:13px 10px;font-size:20px;font-weight:900;letter-spacing:.02em;border-radius:20px;border:3px solid #fff;background:linear-gradient(180deg,#6c86f2,var(--serum));color:#fff;box-shadow:0 5px 0 #1c2e8a,0 8px 18px rgba(0,0,0,.3)}
.cta.ready{background:linear-gradient(180deg,#f6d77d,#d9a441);color:#3d2a08;box-shadow:0 5px 0 #8a5d16,0 8px 18px rgba(0,0,0,.3)}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;height:78px;background:linear-gradient(180deg,#fbf1dc,#ecd7ac);border-top:3px solid #d9b46a;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end}
.tb{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:0 0 9px;font-size:11.5px;font-weight:800;color:#6b4e2a;cursor:pointer}
.tb .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff;border:2px solid #d9b46a;color:var(--serum)}
.tb.home .ic{width:64px;height:64px;margin-top:-30px;border-radius:22px;background:linear-gradient(180deg,#6c86f2,var(--serum));color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #1c2e8a}
.tb[aria-pressed="true"] .ic{background:var(--serum);color:#fff}
.phone .dialog{left:10px;right:10px;bottom:var(--dlg-bottom);max-height:34%;z-index:5}
body.running .phone{--dlg-bottom:90px}
body.running .phone .dialog{max-height:50%}

body.running .phone .bottom-area,body.running .phone .side-l,body.running .phone .side-r{display:none}
.sheet{position:absolute;inset:0;z-index:8;background:rgba(10,14,30,.45);display:flex;align-items:flex-end}
.sheet-card{width:100%;max-height:80%;overflow:auto;background:var(--glass-solid);border-radius:22px 22px 0 0;border-top:3px solid #E9C77A;padding:12px 14px 18px;animation:sheetup .25s ease both}
@keyframes sheetup{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sheet-head b{font-family:var(--f-display);font-size:18px;font-weight:800}
.sheet-x{border:0;background:var(--paper-2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.sheet-sub{font-size:12px;color:var(--mute);margin-bottom:8px}
.menu-list{display:grid;gap:10px;padding-top:6px}
.sheet-card h3{margin:4px 0 8px;font-size:11px;font-family:var(--f-mono);letter-spacing:.18em;color:var(--mute);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.dex-list{display:grid;gap:6px}
.dex-list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.dex-list .g{font-family:var(--f-display);font-weight:800;color:var(--serum)}
.dex-list button.dx{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px;cursor:pointer}
.dex-list button.dx img{width:38px;height:52px;object-fit:cover;border-radius:6px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.dex-list button.dx span:nth-of-type(1){flex:1;text-decoration:underline dotted rgba(0,0,0,.25);text-underline-offset:3px}
.dex-list button.dx:active{background:rgba(31,59,179,.06)}
.album button.tag{font:inherit;cursor:pointer}
.endview{position:fixed;inset:0;z-index:9999;background:rgba(5,7,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));animation:cg-in .3s ease both;cursor:pointer}
.endview[hidden]{display:none}
.endview img{max-width:min(100%,420px);max-height:62vh;object-fit:contain;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.endview .ev-cap{max-width:420px;color:#fff;text-align:center}
.endview .ev-cap small{display:block;color:#ffe08a;font-weight:800;letter-spacing:.2em;font-size:12px}
.endview .ev-cap b{display:block;font-family:var(--f-display);font-size:20px;margin:4px 0 8px}
.endview .ev-cap p{margin:0;font-size:13.5px;line-height:1.6;opacity:.88;max-height:22vh;overflow:auto}
.endview .ev-cap em{display:block;margin-top:10px;font-style:normal;font-size:12px;opacity:.6}
.phone .schedule .acts{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .schedule .slots{display:none}


/* ===== 컬러풀 게임 버튼 (브랜드 블루에 맞추지 않음) ===== */
.fab{--c1:#ff8fb3;--c2:#ff5c8a;--c3:#c93a66}
.fab.c-pink{--c1:#ff9cc0;--c2:#ff5c8a;--c3:#c93a66}
.fab.c-orange{--c1:#ffc46b;--c2:#ff9330;--c3:#c4621a}
.fab.c-purple{--c1:#c3a2ff;--c2:#8f5cff;--c3:#5f34c2}
.fab.c-green{--c1:#9be87a;--c2:#4cc25a;--c3:#2b8a3a}
.fab.c-red{--c1:#ffa38a;--c2:#ff6a4d;--c3:#c23c24}
.fab.c-teal{--c1:#7ff0dc;--c2:#22c3ac;--c3:#138a79}
.fab .ic{background:linear-gradient(180deg,var(--c1),var(--c2));border:3px solid #fff;color:#fff;box-shadow:0 4px 0 var(--c3),0 6px 12px rgba(0,0,0,.25)}
.fab .ic.gauge{background:#fff;border-color:var(--c2)}
.fab .lb{background:linear-gradient(180deg,var(--c2),var(--c3));border-color:#fff}
.gear.snd{width:44px;height:44px;font-size:20px;margin-right:-4px}
.gear{border:3px solid #fff;background:linear-gradient(180deg,#ffe07a,#ffb21f);color:#7a4a00;box-shadow:0 4px 0 #b9780a,0 6px 12px rgba(0,0,0,.25)}
.avatar{border-color:#fff;box-shadow:0 4px 0 #b9780a,0 6px 12px rgba(0,0,0,.25);background-color:#ffe9b5}
.hud-bar i{background:linear-gradient(90deg,#7be35a,#c8f56b)}
.res i{background:linear-gradient(180deg,#ffe07a,#ffb21f);color:#5a3500}
.cta{background:linear-gradient(180deg,#ffd45c,#ff9f1c);color:#fff;text-shadow:0 2px 0 rgba(150,70,0,.55);box-shadow:0 5px 0 #c26a00,0 10px 20px rgba(0,0,0,.3)}
.cta.ready{background:linear-gradient(180deg,#8ff06a,#3fbf45);color:#fff;text-shadow:0 2px 0 rgba(20,100,30,.6);box-shadow:0 5px 0 #23852f,0 10px 20px rgba(0,0,0,.3)}
.tabbar{background:linear-gradient(180deg,#ffe98f,#ffd24d);border-top:3px solid #fff}
.tb{color:#7a4a00}
.tb .ic{border:2px solid #fff;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tb.t-edu .ic{background:linear-gradient(180deg,#9cc8ff,#4f8dff)}
.tb.t-work .ic{background:linear-gradient(180deg,#ffc46b,#ff9330)}
.tb.t-rest .ic{background:linear-gradient(180deg,#c3a2ff,#8f5cff)}
.roles{display:grid;gap:4px}
.role{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.6);border:1px solid #e5d6b2;font-size:12px}
.role .rn{font-weight:700} .role .rm{grid-column:1;color:var(--mute);font-size:11px} .role .mini{grid-row:1/3;grid-column:2}
.role.has{background:#fffaf0;border-color:#d9b46a} .role.locked{opacity:.55}
.role .mini.fire{border-color:#e2362b;color:#e2362b} .role .mini.fire.sure{background:#e2362b;color:#fff}
.tb.t-job .ic{background:linear-gradient(180deg,#ffe27a,#f2b705)}
@media (max-width:420px){.tb .ic{width:36px;height:36px;border-radius:12px}.tb{font-size:11px}}
.letter{position:relative;margin:8px 0 14px;padding:22px 20px 18px;border-radius:6px;background:repeating-linear-gradient(180deg,#fffdf6 0 29px,#e9dfc6 29px 30px);border:1px solid #e3d3ad;box-shadow:0 6px 18px rgba(80,60,20,.15);font-family:'Nanum Pen Script','Nanum Myeongjo',cursive;color:#3b2f1e;transform:rotate(-.4deg)}
.letter::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(201,154,60,.45);transform:rotate(2deg)}
.letter .lt-to{font-size:24px;margin-bottom:6px}.letter .lt-body{font-size:21px;line-height:30px}.letter .lt-body p{margin:0 0 30px;text-indent:1em}.letter .lt-body p:last-child{margin:0;text-indent:0;color:#7a5a2e}.letter .lt-from{text-align:right;font-size:21px;margin-top:12px}
.tb.t-fit .ic{background:linear-gradient(180deg,#8fe08a,#2fb35a)}
.tb.t-menu .ic{background:linear-gradient(180deg,#7ff0dc,#22c3ac)}
.tb.home .ic{background:linear-gradient(180deg,#ff9cc0,#ff5c8a);box-shadow:0 4px 0 #c93a66}
.slot3.filled{border-color:#ffd24d}
.slot3.running{background:#ff9330;border-color:#fff}


/* ===== 작은 대화창: 그림을 가리지 않게 ===== */
.phone .dialog{left:10px;right:10px;bottom:var(--dlg-bottom);max-height:24%;padding:7px 10px;gap:8px;grid-template-columns:30px minmax(0,1fr);background:rgba(255,255,255,.86);border:2px solid #fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
body.running .phone .dialog{max-height:30%}
.phone .dialog .face{width:30px;height:30px}
.phone .dialog .speaker{display:none}
.phone .dialog .head{font-size:14px;margin:0 0 2px}
.phone .dialog .text{font-size:12.5px;line-height:1.45}
.phone .dialog .chips{gap:4px;margin-top:4px}
.phone .dialog .chip{font-size:10.5px;padding:1px 6px}
.phone .dialog .choices{gap:5px;margin-top:6px}
.phone .dialog .choice{padding:6px 10px;font-size:13px}
.phone .dialog .choice small{display:inline;margin-left:6px}
.phone .dialog .next{margin-top:2px}
.phone .dialog .next-btn{padding:5px 14px;font-size:12px}
.phone .dialog.mini .text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}


/* ===== 이벤트 등장인물: 대화창 위로 걸어 나오는 스탠딩 ===== */
.mini-pop{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:0 12%;background:rgba(20,16,40,.25);animation:mini-fade .2s both}
.mini-win{width:100%;max-width:300px;border-radius:18px;padding:8px;background:linear-gradient(180deg,#fff7df,#f3d996);border:3px solid #fff;box-shadow:0 0 0 3px #c99a3c,0 12px 30px rgba(0,0,0,.35);animation:mini-in .35s cubic-bezier(.2,.9,.3,1.3) both}
.mini-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;color:#6b4a10;padding:2px 6px 6px}
.mini-title em{font-style:normal;font-size:11px;background:#c99a3c;color:#fff;border-radius:99px;padding:2px 8px}
.mini-stage{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid #c99a3c;background:var(--mbg,linear-gradient(180deg,#dfe9ff,#fff))}
.mini-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.7) 0 6%,transparent 7%) 0 0/42px 42px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.45) 0 4%,transparent 5%) 0 0/36px 36px;animation:mini-pat 6s linear infinite}
.mini-stage::after{content:"";position:absolute;left:12%;right:12%;bottom:7%;height:9%;border-radius:50%;background:rgba(0,0,0,.14)}
.mini-stage.k-edu{--mbg:linear-gradient(180deg,#d9e6ff,#f6f9ff)} .mini-stage.k-work{--mbg:linear-gradient(180deg,#ffe3c2,#fff6ea)}
.mini-stage.k-rest{--mbg:linear-gradient(180deg,#c9f0e4,#f2fffb)} .mini-stage.k-love{--mbg:linear-gradient(180deg,#ffd2e3,#fff3f8)} .mini-stage.k-job{--mbg:linear-gradient(180deg,#fff0b8,#fffbe8)} .mini-stage.k-fit{--mbg:linear-gradient(180deg,#d6f5c8,#f6fff0)}
.mini-stage img{position:absolute;inset:6% 6% 4%;width:88%;height:90%;object-fit:contain;z-index:1;transform-origin:50% 95%;animation:mini-bob .44s ease-in-out infinite alternate}
.mini-stage img.b{opacity:0} .mini-stage.alt img.a{opacity:0} .mini-stage.alt img.b{opacity:1}
.mini-stage.nob.alt img.a{opacity:1} .mini-stage.nob img.b{display:none}
.mini-stage .fx{position:absolute;z-index:2;font-size:22px;animation:mini-fx 1.1s ease-out both;pointer-events:none}
.mini-bar{height:10px;margin:8px 4px 4px;border-radius:99px;background:#fff;border:2px solid #c99a3c;overflow:hidden}
.mini-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9fc4,#ffb21f);transition:width .2s linear}
.mini-day{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#6b4a10;padding:0 6px}
@keyframes mini-in{from{transform:scale(.6);opacity:0}}
@keyframes mini-fade{from{opacity:0}}
@keyframes mini-bob{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-4%) scale(1.02,.98)}}
@keyframes mini-pat{to{background-position:42px 42px,-36px 36px}}
@keyframes mini-fx{from{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}to{transform:translateY(-70px) scale(1.1);opacity:0}}
.actor{position:absolute;right:2%;z-index:4;height:min(42%,360px);aspect-ratio:2/3;pointer-events:none;transform-origin:50% 100%;animation:actor-in .45s cubic-bezier(.2,.9,.3,1.2) both}
.actor.left{right:auto;left:4%}
.actor img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));animation:actor-idle 3.2s ease-in-out .45s infinite}
.actor.hop img{animation:actor-hop .45s ease both, actor-idle 3.2s ease-in-out .45s infinite}
.actor.shake img{animation:actor-shake .5s ease both, actor-idle 3.2s ease-in-out .5s infinite}
.actor.out{animation:actor-out .3s ease both}
.actor.leave{animation:actor-leave 1.1s ease-in both}
.actor.leave .actor-name{display:none}
@keyframes actor-leave{0%{transform:none;opacity:1}30%{transform:scaleX(-1)}100%{transform:scaleX(-1) translateX(-70%) scale(.85);opacity:0}}
.phone.rainy .scene::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.0) 0 14px,rgba(220,235,255,.35) 14px 15px);background-size:200px 200px;animation:rainfall .5s linear infinite;mix-blend-mode:screen}
@keyframes rainfall{to{background-position:-40px 200px}}
.phone .scene .pimg.place{top:0;height:100%;-webkit-mask-image:none;mask-image:none;animation:fadein .4s ease both}
.actor-name{position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(-4deg);white-space:nowrap;background:linear-gradient(180deg,#ff9cc0,#ff5c8a);color:#fff;font-weight:800;font-size:12px;padding:2px 10px;border-radius:99px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.actor.c-rival .actor-name{background:linear-gradient(180deg,#d8607a,#8f1f3b)}
.actor.c-sec .actor-name{background:linear-gradient(180deg,#7ff0dc,#22a894)}
@keyframes actor-in{from{transform:translateX(60%) scale(.92);opacity:0}to{transform:none;opacity:1}}
.actor.left{animation-name:actor-in-l}
@keyframes actor-in-l{from{transform:translateX(-60%) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes actor-out{to{transform:translateY(12%) scale(.96);opacity:0}}
@keyframes actor-idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.4%) rotate(.6deg)}}
@keyframes actor-hop{0%{transform:translateY(0)}35%{transform:translateY(-7%) scale(1.02,.98)}65%{transform:translateY(0) scale(.98,1.02)}100%{transform:none}}
@keyframes actor-shake{0%,100%{transform:none}20%{transform:translateX(-4%) rotate(-2deg)}40%{transform:translateX(4%) rotate(2deg)}60%{transform:translateX(-2%)}80%{transform:translateX(2%)}}


.tb.t-love .ic{background:linear-gradient(180deg,#ff9cc0,#ff4f86)}

function awardsEvent(S) {
    const yr = Math.floor(S.m / 12);

    const cat = (label, sub, score, flavor) => ({ label, sub, run: S => {
            const ch = [];

            const res = mine >= rivalScore + 12 ? 'grand' : mine >= rivalScore ? 'gold' : 'none';
            S.awards = S.awards || { grand: 0, gold: 0 };
            if (res === 'grand') {
                S.awards.grand++;
                bump(S, 'cash', 3000, ch);
                bump(S, 'aware', 10, ch);
                bump(S, 'fan', 6, ch);
                S.album.push(`${yearOf(S)} 어워즈 대상`);
            }
            else if (res === 'gold') {
                S.awards.gold++;
                bump(S, 'cash', 1000, ch);
                bump(S, 'aware', 5, ch);
                bump(S, 'fan', 3, ch);
            }
            else {
                bump(S, 'stress', 8, ch);
                grow(S, 'lead', 1, ch);
            }
            const head = res === 'grand' ? `대상! (${mine} : ${rivalScore})` : res === 'gold' ? `우수상 (${mine} : ${rivalScore})` : `수상 실패 (${mine} : ${rivalScore})`;
            return { text: `${head}\n${res === 'none' ? `${RIVAL_BRAND}가 트로피를 가져갔다. ${RIVAL}이 무대에서 이쪽을 힐끗 봤다.` : flavor}`, chips: ch };
        } });
